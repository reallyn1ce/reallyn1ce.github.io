name: Предложить материал для архива
description: Скриншот, архивная ссылка, документ или историческое сведение о KoGaMa
title: "[Материал] "
labels: ["material"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за помощь архиву. Предложенные материалы могут проходить проверку перед публикацией; не все материалы будут опубликованы.
        Публикуйте только то, что вы вправе передавать. Не указывайте личные данные других людей.
  - type: dropdown
    id: kind
    attributes:
      label: Тип материала
      options: [Скриншот или изображение, Архивная ссылка (например, Wayback Machine), Документ или объявление, Историческое сведение или событие, Другое]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Что это и к какому периоду относится
      description: Дата или приблизительный период (год), что показано, откуда взято.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Источник или ссылка
      description: Ссылка на оригинал или архивный снимок. Если вы автор скриншота — так и напишите.
  - type: textarea
    id: notes
    attributes:
      label: Что неизвестно или сомнительно
      description: Если дата или происхождение не подтверждены — укажите это честно.
