name: Update traffic

on:
  # Проверяем источник ежедневно: если HypeStat обновит оценку в течение месяца,
  # обновим точку этого месяца. В истории при этом остаётся максимум одна точка/месяц.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch monthly traffic estimate from HypeStat
        run: node scripts/fetch-traffic.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/traffic.json data/meta.json
          if git diff --staged --quiet; then
            echo "Нет новых данных для коммита"
          else
            git commit -m "chore: refresh traffic check metadata"
            git push
          fi
