name: Stamp site version

# Страховка: если при публикации забыли выполнить `node scripts/stamp-version.js`,
# версия ресурсов проставляется автоматически. Иначе браузеры могли бы держать старые CSS/JS.
on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'app.js'
      - 'analytics.js'
      - 'style.css'
      - 'sw.js'
      - 'manifest.json'
      - 'icons/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stamp resource version
        run: node scripts/stamp-version.js
      - name: Run project checks
        run: node scripts/check.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js version.json
          if git diff --staged --quiet; then
            echo "Версия уже актуальна"
          else
            git commit -m "chore: stamp resource version"
            git push
          fi
