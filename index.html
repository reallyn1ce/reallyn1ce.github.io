<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOGAMA ARCHIVE</title>
<meta name="description" content="Памятка о KoGaMa: посещаемость, хронология, сообщества.">
<meta name="theme-color" content="#0c0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARCHIVE">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="header">
  <a class="logo" href="./">KOGAMA ARCHIVE</a>
  <button class="icon-btn" id="themeToggle" type="button" aria-label="Сменить тему"></button>
</header>

<main class="page">
  <section class="hero" aria-labelledby="heroNum">
    <p class="hero-label">Посещаемость kogama.com</p>
    <div class="hero-num" id="heroNum" aria-live="polite">—</div>
    <p class="hero-cap">визитов в месяц <span class="src">HypeStat</span></p>
    <div class="chart" id="chart"></div>
    <p class="hero-meta" id="heroMeta"></p>
  </section>

  <section class="section" aria-labelledby="tl-title">
    <h2 id="tl-title">Хронология</h2>
    <ol class="timeline" id="timeline"></ol>
  </section>

  <section class="section" aria-labelledby="cm-title">
    <h2 id="cm-title">KoGaMa-сообщества</h2>
    <div class="cards" id="communities"></div>
  </section>
</main>

<footer class="footer">Неофициальная памятка. Проект не связан с Multiverse ApS.</footer>

<script src="./app.js"></script>
</body>
</html>
